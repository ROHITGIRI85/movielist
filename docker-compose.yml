services:
  mongodb:
    image: mongo:8
    container_name: imovies-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - imovies_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  imovies_mongo_data:
